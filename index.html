<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b352b" />
    <title>Arga 2.0 | Internal</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #18352d;
        background: #f3f6f1;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 460px);
        background: #fff;
        border: 1px solid #e2e9e2;
        border-radius: 20px;
        padding: 32px;
        box-shadow: 0 18px 55px #17352b12;
      }
      .mark {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border-radius: 15px;
        background: #0b352b;
        color: white;
        font-weight: 800;
      }
      h1 { font-size: 25px; margin: 22px 0 8px; }
      p { color: #5c7069; line-height: 1.55; margin: 0 0 20px; }
      button {
        width: 100%;
        min-height: 48px;
        border: 1px solid #d6dfd9;
        border-radius: 10px;
        background: white;
        color: #18352d;
        font-size: 15px;
        font-weight: 650;
        cursor: pointer;
      }
      button:hover { background: #f7faf7; }
      button:disabled { opacity: .6; cursor: wait; }
      #status {
        display: none;
        margin-top: 18px;
        border-radius: 10px;
        padding: 13px 14px;
        font-size: 14px;
        line-height: 1.5;
      }
      #status.visible { display: block; }
      #status.info { background: #eef5f0; color: #315a49; }
      #status.error { background: #fff0ed; color: #8a3023; }
      #user {
        display: none;
        margin-top: 18px;
        border-top: 1px solid #e8ede9;
        padding-top: 18px;
        font-size: 14px;
        color: #5c7069;
      }
      #user.visible { display: block; }
      #signout { margin-top: 12px; }
      .note { font-size: 12px; margin: 22px 0 0; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">A</div>
      <h1>Arga 2.0</h1>
      <p>Masuk dengan akun Google yang didaftarkan untuk tim Arga Adventure.</p>

      <button id="signin" type="button">Masuk dengan Google</button>
      <div id="status" role="status" aria-live="polite"></div>

      <div id="user">
        <span id="email"></span>
        <button id="signout" type="button">Keluar</button>
      </div>

      <p class="note">
        Akses ke data internal baru dibuka setelah backend memeriksa daftar anggota dan role.
      </p>
    </main>

    <iframe
      id="access-frame"
      name="access-frame"
      title="Pemeriksaan akses Arga Adventure"
      hidden>
    </iframe>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
      import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
        signOut,
        onAuthStateChanged
      } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBydyEGrTsFjL_icqKEiWj9AU1ZG3sQHqs",
        authDomain: "arga-adventure-internal-app.firebaseapp.com",
        projectId: "arga-adventure-internal-app",
        appId: "1:830680121802:web:0e3a0175c4d59fb8468f33"
      };

      const ACCESS_CHECK_URL =
        "https://script.google.com/macros/s/AKfycbxZZNm_K08oTnOThAJfzCiT_OMOWAQSTNTiiR3bxwAsSZrMc3a4CLRTMggXoMn25Zqzpg/exec";

      const statusBox = document.querySelector("#status");
      const signInButton = document.querySelector("#signin");
      const userBox = document.querySelector("#user");
      const emailBox = document.querySelector("#email");

      const auth = getAuth(initializeApp(firebaseConfig));
      const provider = new GoogleAuthProvider();

      function showStatus(message, type = "info") {
        statusBox.textContent = message;
        statusBox.className = `visible ${type}`;
      }

      async function checkTeamAccess(user) {
        const idToken = await user.getIdToken();
        const nonce = crypto.randomUUID().replaceAll("-", "");

        showStatus("Memeriksa daftar akses Arga…");

        const result = await new Promise((resolve, reject) => {
          const timeout = setTimeout(() => {
            window.removeEventListener("message", onMessage);
            reject(new Error("Pemeriksaan akses terlalu lama. Muat ulang halaman lalu coba lagi."));
          }, 20000);

          function onMessage(event) {
            const trustedAppsScriptOrigin =
              /^https:\/\/(?:[a-z0-9-]+-)?script\.googleusercontent\.com$/i.test(event.origin) ||
              event.origin === "https://script.google.com";

            // PERBAIKAN: pengecekan event.source dihapus. Pesan datang dari
            // iframe sandbox Google di dalam access-frame, jadi source-nya
            // bukan accessFrame.contentWindow. Keamanan tetap dijaga oleh
            // pengecekan origin dan nonce acak di bawah.
            if (!trustedAppsScriptOrigin) {
              return;
            }

            const message = event.data;
            if (
              !message ||
              message.channel !== "arga-access" ||
              message.nonce !== nonce
            ) {
              return;
            }

            clearTimeout(timeout);
            window.removeEventListener("message", onMessage);
            resolve(message.result);
          }

          window.addEventListener("message", onMessage);

          const form = document.createElement("form");
          form.method = "POST";
          form.action = ACCESS_CHECK_URL;
          form.target = "access-frame";
          form.enctype = "application/x-www-form-urlencoded";

          const fields = {
            payload: JSON.stringify({ idToken }),
            nonce
          };

          for (const [name, value] of Object.entries(fields)) {
            const input = document.createElement("input");
            input.type = "hidden";
            input.name = name;
            input.value = value;
            form.appendChild(input);
          }

          document.body.appendChild(form);
          form.submit();
          form.remove();
        });

        if (!result || result.allowed !== true) {
          throw new Error(
            (result && result.message) ||
            "Akun ini belum mendapat izin dari Admin Arga Adventure."
          );
        }

        showStatus(`Akses disetujui · Role: ${result.role}`);
      }

      signInButton.addEventListener("click", async () => {
        signInButton.disabled = true;
        try {
          await signInWithPopup(auth, provider);
        } catch (error) {
          showStatus(
            error.message || "Login tidak berhasil. Silakan coba lagi.",
            "error"
          );
        } finally {
          signInButton.disabled = false;
        }
      });

      document.querySelector("#signout").addEventListener("click", () => {
        signOut(auth);
      });

      onAuthStateChanged(auth, async (user) => {
        userBox.classList.toggle("visible", Boolean(user));
        signInButton.hidden = Boolean(user);

        if (user) {
          emailBox.textContent = user.email || "Akun Google";
          try {
            await checkTeamAccess(user);
          } catch (error) {
            showStatus(error.message, "error");
          }
        } else {
          statusBox.className = "";
        }
      });
    </script>
  </body>
</html>
