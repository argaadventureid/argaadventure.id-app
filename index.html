<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b352b">
  <title>Arga 2.0 | Internal</title>
  <style>
    :root {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #18352d;
      background: #f3f6f1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(100%, 1600px);
      background: #fff;
      border: 1px solid #e2e9e2;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 18px 55px #17352b12;
    }
    .mark {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: #0b352b;
      color: #fff;
      font-weight: 800;
    }
    h1 { font-size: 25px; margin: 22px 0 8px; }
    p { color: #5c7069; line-height: 1.55; margin: 0 0 20px; }
    button {
      min-height: 48px;
      border: 1px solid #d6dfd9;
      border-radius: 10px;
      background: #fff;
      color: #18352d;
      font-size: 15px;
      font-weight: 650;
      cursor: pointer;
    }
    button:hover { background: #f7faf7; }
    button:disabled { opacity: .6; cursor: wait; }
    #signin, #signout { width: 100%; }
    #status {
      display: none;
      margin-top: 18px;
      border-radius: 10px;
      padding: 13px 14px;
      font-size: 14px;
      line-height: 1.5;
    }
    #status.visible { display: block; }
    #status.info { background: #eef5f0; color: #315a49; }
    #status.error { background: #fff0ed; color: #8a3023; }
    #user {
      display: none;
      margin-top: 18px;
      border-top: 1px solid #e8ede9;
      padding-top: 18px;
      font-size: 14px;
      color: #5c7069;
    }
    #user.visible { display: block; }
    #signout { margin-top: 12px; }
    #dashboard { margin-top: 28px; }
    #dashboard[hidden], #crm-view[hidden] { display: none; }
    .modules {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .module {
      border: 1px solid #e2e9e2;
      border-radius: 14px;
      padding: 18px;
      background: #fbfcfa;
    }
    .module h2 { font-size: 17px; margin: 0 0 8px; }
    .module p { font-size: 13px; margin: 0; }
    .module-action {
      width: 100%;
      min-height: 130px;
      text-align: left;
    }
    .module-action h2, .module-action p { pointer-events: none; }
    .note { font-size: 12px; margin: 22px 0 0; }
    .crm-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 24px 0 14px;
    }
    .crm-heading h2 { margin: 0; }
    #back-dashboard { padding: 0 16px; }
    .table-scroll {
      overflow: auto;
      border: 1px solid #e2e9e2;
      border-radius: 12px;
    }
    table { border-collapse: collapse; min-width: 900px; width: 100%; }
    th, td {
      border-bottom: 1px solid #e8ede9;
      padding: 10px 12px;
      text-align: left;
      font-size: 13px;
      vertical-align: top;
      white-space: pre-wrap;
    }
    th { background: #f3f6f1; }
    @media (max-width: 600px) {
      main { padding: 22px; }
      .crm-heading { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">A</div>
    <h1>Arga 2.0</h1>
    <p>Masuk dengan akun Google yang didaftarkan untuk tim Arga Adventure.</p>

    <button id="signin" type="button">Masuk dengan Google</button>
    <div id="status" role="status" aria-live="polite"></div>

    <div id="user">
      <span id="email"></span>
      <button id="signout" type="button">Keluar</button>
    </div>

    <section id="dashboard" hidden>
      <h2>Dashboard</h2>
      <div id="module-menu" class="modules"></div>

      <section id="crm-view" hidden>
        <div class="crm-heading">
          <h2>Data CRM</h2>
          <button id="back-dashboard" type="button">Kembali</button>
        </div>
        <div id="crm-message" class="note"></div>
        <div class="table-scroll">
          <table>
            <thead id="crm-head"></thead>
            <tbody id="crm-body"></tbody>
          </table>
        </div>
      </section>

      <p class="note">Data CRM ditampilkan hanya untuk role yang memiliki akses.</p>
    </section>
  </main>

  <iframe id="access-frame" name="access-frame"
          title="Pemeriksaan akses Arga Adventure" hidden></iframe>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBydyEGrTsFjL_icqKEiWj9AU1ZG3sQHqs",
      authDomain: "arga-adventure-internal-app.firebaseapp.com",
      projectId: "arga-adventure-internal-app",
      appId: "1:830680121802:web:0e3a0175c4d59fb8468f33"
    };

    const ACCESS_CHECK_URL =
      "https://script.google.com/macros/s/AKfycbxVahhCaebAZwZXBLjtLmIEvSyk0KGMG8mBGEJ3eboKhR9G-Bw_zPwMl5V2tA5MN0sRnA/exec";

    const statusBox = document.querySelector("#status");
    const signInButton = document.querySelector("#signin");
    const userBox = document.querySelector("#user");
    const emailBox = document.querySelector("#email");
    const dashboard = document.querySelector("#dashboard");
    const moduleMenu = document.querySelector("#module-menu");
    const crmView = document.querySelector("#crm-view");
    const crmMessage = document.querySelector("#crm-message");
    const crmHead = document.querySelector("#crm-head");
    const crmBody = document.querySelector("#crm-body");
    const accessFrame = document.querySelector("#access-frame");

    const auth = getAuth(initializeApp(firebaseConfig));
    const provider = new GoogleAuthProvider();
    let signedInUser = null;

    function showStatus(message, type = "info") {
      statusBox.textContent = message;
      statusBox.className = `visible ${type}`;
    }

    function callBackend(user, action) {
      return new Promise(async (resolve, reject) => {
        let idToken;
        try {
          idToken = await user.getIdToken();
        } catch (_error) {
          reject(new Error("Sesi login tidak terbaca. Silakan masuk kembali."));
          return;
        }

        const nonce = crypto.randomUUID().replaceAll("-", "");
        const timeout = setTimeout(() => {
          window.removeEventListener("message", onMessage);
          reject(new Error("Pemeriksaan akses terlalu lama. Muat ulang halaman lalu coba lagi."));
        }, 20000);

        function onMessage(event) {
          const trustedOrigin =
            /^https:\/\/(?:[a-z0-9-]+-)?script\.googleusercontent\.com$/i.test(event.origin) ||
            event.origin === "https://script.google.com";

          if (!trustedOrigin) return;

          const message = event.data;
          if (!message || message.channel !== "arga-access" || message.nonce !== nonce) return;

          clearTimeout(timeout);
          window.removeEventListener("message", onMessage);
          resolve(message.result);
        }

        window.addEventListener("message", onMessage);

        const form = document.createElement("form");
        form.method = "POST";
        form.action = ACCESS_CHECK_URL;
        form.target = "access-frame";
        form.enctype = "application/x-www-form-urlencoded";

        const fields = {
          payload: JSON.stringify({ idToken, action }),
          nonce
        };

        for (const [name, value] of Object.entries(fields)) {
          const input = document.createElement("input");
          input.type = "hidden";
          input.name = name;
          input.value = value;
          form.appendChild(input);
        }

        document.body.appendChild(form);
        form.submit();
        form.remove();
      });
    }

    function showDashboard(role) {
      moduleMenu.replaceChildren();

      if (role === "Admin" || role === "CRM") {
        const crmButton = document.createElement("button");
        crmButton.type = "button";
        crmButton.id = "open-crm";
        crmButton.className = "module module-action";

        const title = document.createElement("h2");
        title.textContent = "CRM";
        const description = document.createElement("p");
        description.textContent = "Lihat data lead dan tindak lanjut.";
        crmButton.append(title, description);
        moduleMenu.appendChild(crmButton);
      }

      const otherModules = [];
      if (role === "Admin" || role === "Trip & Event") {
        otherModules.push({
          title: "Trip & Event",
          description: "Informasi perjalanan dan acara."
        });
      }
      if (role === "Admin" || role === "Finance") {
        otherModules.push({
          title: "Finance",
          description: "Informasi dan pencatatan keuangan."
        });
      }

      otherModules.forEach(item => {
        const card = document.createElement("article");
        card.className = "module";
        const title = document.createElement("h2");
        title.textContent = item.title;
        const description = document.createElement("p");
        description.textContent = item.description;
        card.append(title, description);
        moduleMenu.appendChild(card);
      });

      dashboard.hidden = false;
    }

    async function checkTeamAccess(user) {
      const result = await callBackend(user, "checkAccess");

      if (!result || result.allowed !== true) {
        throw new Error((result && result.message) || "Akun ini belum mendapat izin dari Admin Arga.");
      }

      showStatus(`Akses disetujui · Role: ${result.role}`);
      showDashboard(result.role);
    }

    async function loadCrm() {
      crmView.hidden = false;
      moduleMenu.hidden = true;
      crmMessage.textContent = "Memuat data CRM…";
      crmHead.replaceChildren();
      crmBody.replaceChildren();

      try {
        const result = await callBackend(signedInUser, "crmList");
        if (!result || result.allowed !== true) {
          throw new Error((result && result.message) || "Data CRM tidak dapat dibuka.");
        }

        const headerRow = document.createElement("tr");
        result.headers.forEach(value => {
          const th = document.createElement("th");
          th.textContent = value;
          headerRow.appendChild(th);
        });
        crmHead.appendChild(headerRow);

        result.rows.forEach(row => {
          const tr = document.createElement("tr");
          row.forEach(value => {
            const td = document.createElement("td");
            td.textContent = value;
            tr.appendChild(td);
          });
          crmBody.appendChild(tr);
        });

        crmMessage.textContent = result.rows.length
          ? `Menampilkan ${result.rows.length} lead pertama${result.hasMore ? " (data lainnya belum ditampilkan)." : "."}`
          : "Belum ada data CRM.";
      } catch (error) {
        crmMessage.textContent = error.message;
      }
    }

    moduleMenu.addEventListener("click", event => {
      if (event.target.closest("#open-crm")) loadCrm();
    });

    document.querySelector("#back-dashboard").addEventListener("click", () => {
      crmView.hidden = true;
      moduleMenu.hidden = false;
    });

    signInButton.addEventListener("click", async () => {
      signInButton.disabled = true;
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        showStatus(error.message || "Login tidak berhasil. Silakan coba lagi.", "error");
      } finally {
        signInButton.disabled = false;
      }
    });

    document.querySelector("#signout").addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, async user => {
      signedInUser = user;
      userBox.classList.toggle("visible", Boolean(user));
      signInButton.hidden = Boolean(user);
      dashboard.hidden = true;
      crmView.hidden = true;
      moduleMenu.hidden = false;

      if (user) {
        emailBox.textContent = user.email || "Akun Google";
        try {
          await checkTeamAccess(user);
        } catch (error) {
          showStatus(error.message, "error");
        }
      } else {
        statusBox.className = "";
      }
    });
  </script>
</body>
</html>
